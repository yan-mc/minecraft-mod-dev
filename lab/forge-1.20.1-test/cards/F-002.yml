  - {slot_exists: 0}
  - {no_exception: true}
ui:
  open: true
  slots: true
  click:
    - {slot: 0, button: 0, shift: true}
  screenshot: true
evidence:
  - "ChargerScreen open: 37 slots, title Charger"
  - "shift-click 0->36 and 36->0, Charged Item count stays 1"
  - "Energy 5000/10000 bar + text; close/reopen keeps item + energy"
  - "screenshots mcdev-1792258312165.png / mcdev-1792258351039.png + read_image"
  - "M4-F002-REPORT.md; M4-CLIENT-CHECKS.md"
status: passed
