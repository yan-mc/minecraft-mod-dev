id: F-007
title: 生存模式玩家挖掘掉落
spec:
  - charger 方块有 mineable/pickaxe 标签，铁镐可正常收获
  - 客户端发送 START_DESTROY_BLOCK，服务端以 survival 权威移除方块
  - 服务端方块变 air，附近 ItemEntity 掉出 charger ×1
tiers:
  static: true
  gametest: false
  server_scenario: true
  client_ui: true
setup:
  commands:
    - "difficulty peaceful"
    - "fill -2 63 -2 2 63 2 minecraft:stone"
    - "setblock 0 64 0 examplemod:charger"
    - "gamemode survival Dev"
    - "effect give Dev minecraft:instant_health 1 10"
    - "tp Dev 0.5 64 2.5 180 30"
    - "item replace entity Dev weapon.mainhand with minecraft:iron_pickaxe 1"
    - "kill @e[type=item]"
actions:
  - {close_ui: true}
  - {wait: 1000}
  - {client_mine: {x: 0, y: 64, z: 0, timeoutMs: 8000}}
assert:
  - {block_state: {x: 0, y: 64, z: 0, block: "minecraft:air"}}
  - {loot_items: {x: 0, y: 64, z: 0, r: 4, item: "examplemod:charger", count: 1}}
evidence:
  - "Root cause: charger requiresCorrectToolForDrops but data/minecraft/tags/blocks/mineable/pickaxe.json missing"
  - "Added mineable/pickaxe tag; mcdev_build exit 0"
  - "Client /player/mine sends START_DESTROY_BLOCK packet; server authoritative block air; local client block may lag"
  - "Card live: client_mine → block_state=air, loot_items total=1, warnings=[]"
  - "Server /world/mine remains available as deterministic fallback"
status: passed
