id: F-006
title: 充能物品能量条
spec:
  - charged_item 在物品栏显示类似耐久条的能量条
  - Energy 为 0 或 10000 时不显示
  - 0 < Energy < 10000 时显示，宽度 = max(1, energy * 13 / 10000)
  - energy >= 5000 绿色，>= 2000 黄色，否则红色
  - 不改变 NBT/tooltip/右键使用
tiers:
  static: true
  gametest: true
  server_scenario: false
  client_ui: true
setup:
  commands:
    - "give Dev examplemod:charged_item 1"
actions: []
assert:
  - {item_bar: {item: "examplemod:charged_item", nbt: "Energy:5000", visible: true, width: 6, color: 65280}}
  - {no_exception: true}
ui:
  open: false
  screenshot: true
evidence:
  - "builder-item: ChargedItem isBarVisible/getBarWidth/getBarColor; mcdev_build exit 0"
  - "tester-item: GameTest chargedItemBar, 11 assertions"
  - "Lead verification: mcdev_gametest All 12 required tests passed"
  - "mcdev_scenario card=F-006 live: item_bar visible/width=6/color=65280; warnings=[]"
  - "M4-TEAM-WORKFLOW.md"
status: passed
