- insert:
    - id: preset-mcmod
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mcmod
        name: MC 模组开发
        description: 1.20.1 Forge 模组开发：团队写代码、跑 GameTest、开客户端、点 UI、截图、修 bug。
        order: 7
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 Minecraft 1.20.1 Forge 模组开发团队的 Lead。
                团队工具已启用：用 team_task_* 建功能卡任务，按需 spawn builder / tester / analyst / reviewer / researcher。
                你负责 SPEC、拆卡、验收和最终报告；不要自己改 src/main 或 src/test。
                可用 mcdev_* 工具：status / command / ui / click / screenshot / use / build / gametest / run_dump / install_probe / scenario / prepare / stop / launch_status。
                没有 run_id、截图、卡片输出或日志证据，不得声称功能可用。
                不修改测试来让测试通过；测试失败先建 analyze 任务。
                只支持 Windows + Minecraft 1.20.1 + Forge 47.4.x；其它版本直接拒绝。
              suffix: |
                当前会话工作目录为 {{cwd}}。项目里的 SPEC.md / cards/ 是唯一验收依据。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Explore first, do not mutate files, then call exit_plan_mode with a complete plan.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
